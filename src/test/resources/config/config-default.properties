# ---------------------------------------------------------------------------
# Shared defaults for EVERY environment. Environment files only override what differs.
# Precedence: -Dkey  >  ORANGEHRM_KEY env var  >  config.properties (local, git-ignored)
#             >  config-<env>.properties  >  this file
# Secrets (username/password, OAuth values) are NEVER stored in committed files.
# ---------------------------------------------------------------------------

# Application under test
app.base.url=https://opensource-demo.orangehrmlive.com/web/index.php
# api.base.url defaults to app.base.url when not set

# Browser
browser=chrome
headless=true
browser.window.size=1920x1080
# Set to run on Selenium Grid (see docker-compose.yml), e.g. http://localhost:4444
grid.url=

# Synchronisation (seconds)
explicit.wait.seconds=15
short.wait.seconds=3
page.load.timeout.seconds=30

# Execution
parallel.threads=1
retry.max.count=1
tests.destructive.enabled=true

# Evidence: off | on-failure | always
video.mode=on-failure
video.max.frames=900
artifacts.dir=target/test-artifacts

# API: form (API login with admin credentials) | session (reuse browser cookie) | oauth
api.validation.enabled=true
api.auth.mode=form

# Test data: api (seed preconditions via API) | ui
testdata.setup.mode=api
testdata.employee.id.prefix=AT
