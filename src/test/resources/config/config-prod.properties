# PROD: read-only smoke checks. Scenarios tagged @destructive (they create/modify/delete data)
# are skipped by a hook guard, and CI also excludes them by tag expression.
tests.destructive.enabled=false
api.validation.enabled=false
parallel.threads=2
retry.max.count=1
explicit.wait.seconds=10
video.mode=on-failure
testdata.employee.id.prefix=PR
